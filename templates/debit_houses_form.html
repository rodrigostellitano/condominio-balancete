<!doctype html>
<html>
  <head>
    <title>Cadastro de Casas com Débito</title>
  </head>
  <body>
    {% extends "base.html" %} {% block content %}
    <h1>Casas com Débito - {{ month }}/{{ year }}</h1>

    <h2>Adicionar Casa com Débito</h2>
    <form method="POST">
      <label>Casa:</label>
      <input type="text" name="house" required /><br />
      <label>Mês de Débito:</label>
      <input
        type="text"
        name="debt_month"
        value="{{ mes_anterior }}"
        required
      /><br />
      <label>Ano de Débito:</label>
      <input
        type="text"
        name="debt_year"
        value="{{ ano_anterior }}"
        required
      /><br /><br />
      <button type="submit" name="add_debit" value="1">Adicionar Casa</button>
    </form>

    <h2>Casas Temporárias</h2>
    <table border="1">
      <tr>
        <th>Casa</th>
        <th>Mês Débito</th>
        <th>Ano Débito</th>
        <th>Ações</th>
      </tr>
      {% for d in debits %}
      <tr>
        <td>{{ d.house }}</td>
        <td>{{ d.debt_month }}</td>
        <td>{{ d.debt_year }}</td>
        <td>
          <form method="POST" style="display: inline">
            <input
              type="hidden"
              name="delete_index"
              value="{{ loop.index0 }}"
            />
            <button type="submit" name="delete">Deletar</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>

    <form method="POST">
      <button type="submit" name="save_all" value="1">
        Salvar Todas no Banco
      </button>
    </form>
    {% endblock %}
  </body>
</html>
